# Base de données de développement (MySQL 8.4 LTS).
# Port hôte 3307 : le 3306 est souvent déjà pris par un MySQL local.
# Nom fixe : le même projet, le même conteneur et le même volume sur toutes les machines,
# quel que soit le nom du dossier du projet (sinon Docker prend le nom du dossier).
name: banlieue-alerte

services:
  db:
    image: mysql:8.4.7
    container_name: banlieue-alerte-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-banlieue_alerte}
      MYSQL_USER: ${MYSQL_USER:-banlieue}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?définir MYSQL_PASSWORD dans .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?définir MYSQL_ROOT_PASSWORD dans .env}
    command: ['--character-set-server=utf8mb4', '--collation-server=utf8mb4_unicode_ci']
    ports:
      - '127.0.0.1:${MYSQL_PORT:-3307}:3306'
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      # Forme shell : la variable doit être remplacée dans le conteneur (pas de shell en forme CMD).
      test:
        ['CMD-SHELL', 'mysqladmin ping -h localhost -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db-data:
    name: banlieue-alerte-db-data
