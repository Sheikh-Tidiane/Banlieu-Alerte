    post:
      summary: 'nouvelle alerte, en attente d''approbation (jamais envoyée à la création).'
      responses:
        '200': { description: 'Succès (201 pour une création)' }
        '4XX': { description: 'Erreur de validation, d’accès ou de débit' }
  /api/alerts/{id}:
