# Généré par scripts/build-openapi.ts – ne pas modifier à la main (npm run openapi).
openapi: 3.1.0
info:
  title: API Banlieue Alerte
  version: 1.0.0
  description: >-
    API REST de Banlieue Alerte. Réponses JSON { data } ou { error: { code, message, details } }.
    Les routes qui modifient des données exigent un en-tête Origin du site (CSRF, D-035) ;
    les routes de l’équipe exigent une session (cookie ba_session) et un rôle, et le second
    facteur pour un administrateur. Les schémas des corps sont les validateurs Zod de src/validators/.
servers:
  - url: /
paths:
  /api/abuse/{id}/block-author:
    post:
      summary: 'bloquer l''auteur d''un commentaire signalé (administrateur).'
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 'Succès (201 pour une création)' }
        '4XX': { description: 'Erreur de validation, d’accès ou de débit' }
  /api/abuse/{id}/dismiss:
    post:
      summary: 'classer un signalement d''abus sans suite.'
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 'Succès (201 pour une création)' }
        '4XX': { description: 'Erreur de validation, d’accès ou de débit' }
  /api/account:
    delete:
      summary: 'suppression du compte (signalements anonymisés et conservés).'
      responses:
        '200': { description: 'Succès (201 pour une création)' }
        '4XX': { description: 'Erreur de validation, d’accès ou de débit' }
    get:
      summary: 'export de toutes mes données (JSON téléchargeable).'
      responses:
        '200': { description: 'Succès (201 pour une création)' }
        '4XX': { description: 'Erreur de validation, d’accès ou de débit' }
    patch:
      summary: 'nom et langue.'
      responses:
        '200': { description: 'Succès (201 pour une création)' }
        '4XX': { description: 'Erreur de validation, d’accès ou de débit' }
  /api/account/followup:
    get:
      summary: 'notifications d''avancement du compte connecté.'
      responses:
        '200': { description: 'Succès (201 pour une création)' }
        '4XX': { description: 'Erreur de validation, d’accès ou de débit' }
    post:
      summary: 'tout marquer comme lu.'
      responses:
        '200': { description: 'Succès (201 pour une création)' }
        '4XX': { description: 'Erreur de validation, d’accès ou de débit' }
  /api/account/notifications:
    get:
      summary: 'notifications reçues par le compte.'
      responses:
        '200': { description: 'Succès (201 pour une création)' }
        '4XX': { description: 'Erreur de validation, d’accès ou de débit' }
    post:
      summary: 'tout marquer comme lu.'
      responses:
        '200': { description: 'Succès (201 pour une création)' }
        '4XX': { description: 'Erreur de validation, d’accès ou de débit' }
  /api/admin/escalation-rules:
    post:
      summary: 'délais de première réponse (administrateur).'
      responses:
        '200': { description: 'Succès (201 pour une création)' }
        '4XX': { description: 'Erreur de validation, d’accès ou de débit' }
  /api/admin/rules:
    post:
      summary: 'nouvelle version de la grille, ou activation (retour en arrière).'
      responses:
        '200': { description: 'Succès (201 pour une création)' }
        '4XX': { description: 'Erreur de validation, d’accès ou de débit' }
  /api/admin/users/{id}/block:
